name: Bug report
description: Report a bug in Times Table Hero
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more detail you give, the faster we can fix it.

  - type: dropdown
    id: module
    attributes:
      label: Which module is affected?
      options:
        - Times Tables
        - Arithmetic
        - Time
        - Fractions
        - Shapes
        - Charts
        - Number Sense
        - Money
        - Decimals
        - Number Theory
        - Conversions
        - Word Problems
        - Hub / other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong, in one or two sentences.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Hub
        2. Click "Decimals"
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Browser and OS
      placeholder: Chrome 130 on Windows 11; Safari 17 on iPad

  - type: checkboxes
    id: search
    attributes:
      label: Pre-check
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
